<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Compact DQN Runtime Decision Flow</title>
<style>
  html,body{margin:0;padding:0;background:#fff;}
  .wrap{width:840px;margin:0 auto;padding:18px;}
  svg{width:100%;height:auto;font-family:Arial,Helvetica,sans-serif;}
  .title{font-size:17px;font-weight:700;fill:#172231;}
  .label{font-size:14.5px;font-weight:600;fill:#243447;}
  .small{font-size:13.5px;fill:#526171;}
  .tiny{font-size:11.5px;fill:#526171;}
  .link{font-size:14px;font-weight:600;fill:#27384a;}
  .primary-link{font-size:15.5px;font-weight:600;fill:#27384a;}
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 840 375" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="stepArrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#24364b" flood-opacity="0.13"/>
    </filter>
  </defs>

  <!-- Exact client-side DQN observation: 1 + 1 + 6 + 3 + 6 + 6 = 23 -->
  <g transform="translate(-10,0)">
  <rect x="15" y="20" width="232" height="300" rx="16" fill="#F6F6F6" stroke="#6B7280" stroke-width="1.8" filter="url(#shadow)"/>

  <rect x="31" y="36" width="200" height="32" rx="7" fill="#EAE4F3" stroke="#6F4C9B" stroke-width="1.3"/>
  <path d="M42,59 L49,49 L56,54 L64,42" fill="none" stroke="#6F4C9B" stroke-width="1.6"/>
  <circle cx="42" cy="59" r="1.7" fill="#6F4C9B"/><circle cx="49" cy="49" r="1.7" fill="#6F4C9B"/><circle cx="56" cy="54" r="1.7" fill="#6F4C9B"/><circle cx="64" cy="42" r="1.7" fill="#6F4C9B"/>
  <text x="145" y="57" text-anchor="middle" class="label">LSTM prediction</text>

  <rect x="31" y="74" width="200" height="32" rx="7" fill="#FFF7E8" stroke="#E69F00" stroke-width="1.3"/>
  <path d="M42,81 H57 V99 H42 Z M46,78 H53" fill="none" stroke="#C98200" stroke-width="1.4"/>
  <rect x="45" y="90" width="9" height="6" fill="#F4C36A"/>
  <text x="145" y="95" text-anchor="middle" class="label">Buffer level</text>

  <rect x="31" y="112" width="200" height="32" rx="7" fill="#E1F3ED" stroke="#009E73" stroke-width="1.3"/>
  <g transform="translate(41,128)" fill="none" stroke="#009E73" stroke-width="1.3">
    <circle cx="2" cy="0" r="2.5" fill="#009E73"/><circle cx="9" cy="0" r="2.5"/><circle cx="16" cy="0" r="2.5"/><circle cx="23" cy="0" r="2.5"/><circle cx="30" cy="0" r="2.5"/><circle cx="37" cy="0" r="2.5"/>
  </g>
  <text x="145" y="133" text-anchor="middle" class="label">Previous tier</text>

  <rect x="31" y="150" width="200" height="36" rx="7" fill="#E1EFF8" stroke="#0072B2" stroke-width="1.3"/>
  <path d="M42,177 V165 M48,177 V158 M54,177 V169 M60,177 V162" fill="none" stroke="#0072B2" stroke-width="1.7"/>
  <text x="145" y="173" text-anchor="middle" class="label">Throughput statistics</text>

  <rect x="31" y="192" width="200" height="32" rx="7" fill="#F4E5EF" stroke="#CC79A7" stroke-width="1.3"/>
  <path d="M42,216 V209 H47 V216 M51,216 V204 H56 V216 M60,216 V198 H65 V216" fill="none" stroke="#CC79A7" stroke-width="1.5"/>
  <text x="145" y="213" text-anchor="middle" class="label">Tier bitrates</text>

  <rect x="31" y="230" width="200" height="32" rx="7" fill="#F4E5EF" stroke="#CC79A7" stroke-width="1.3"/>
  <g transform="translate(42,238)" fill="#CC79A7">
    <circle cx="2" cy="3" r="1.7"/><circle cx="10" cy="7" r="1.7"/><circle cx="18" cy="2" r="1.7"/><circle cx="5" cy="14" r="1.7"/><circle cx="16" cy="16" r="1.7"/><circle cx="24" cy="10" r="1.7"/>
  </g>
  <text x="145" y="251" text-anchor="middle" class="label">Point densities</text>

  <text x="131" y="303" text-anchor="middle" class="title">Client State Inputs s<tspan baseline-shift="sub" font-size="12">t</tspan></text>
  </g>

  <!-- State vector to the deployed DQN -->
  <line x1="241" y1="170" x2="300" y2="170" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="270.5" y="160" text-anchor="middle" class="link">features</text>

  <!-- Client-side DQN; network element is centered above its text -->
  <rect x="304" y="20" width="232" height="300" rx="16" fill="#EAE4F3" stroke="#6F4C9B" stroke-width="1.8" filter="url(#shadow)"/>
  <g transform="translate(345,53)" stroke="#6F4C9B" stroke-width="1.3" fill="none">
    <g opacity="0.72">
      <line x1="4" y1="12" x2="53" y2="8"/><line x1="4" y1="12" x2="53" y2="38"/>
      <line x1="4" y1="52" x2="53" y2="8"/><line x1="4" y1="52" x2="53" y2="38"/><line x1="4" y1="52" x2="53" y2="68"/>
      <line x1="4" y1="92" x2="53" y2="38"/><line x1="4" y1="92" x2="53" y2="68"/>
      <line x1="53" y1="8" x2="102" y2="8"/><line x1="53" y1="8" x2="102" y2="38"/>
      <line x1="53" y1="38" x2="102" y2="8"/><line x1="53" y1="38" x2="102" y2="38"/><line x1="53" y1="38" x2="102" y2="68"/>
      <line x1="53" y1="68" x2="102" y2="38"/><line x1="53" y1="68" x2="102" y2="68"/>
      <line x1="102" y1="8" x2="151" y2="11"/><line x1="102" y1="38" x2="151" y2="27"/><line x1="102" y1="38" x2="151" y2="43"/><line x1="102" y1="68" x2="151" y2="59"/><line x1="102" y1="68" x2="151" y2="75"/><line x1="102" y1="68" x2="151" y2="91"/>
    </g>
    <g fill="#C7B7DA"><circle cx="4" cy="12" r="4"/><circle cx="4" cy="52" r="4"/><circle cx="4" cy="92" r="4"/></g>
    <g fill="#9278B2"><circle cx="53" cy="8" r="4"/><circle cx="53" cy="38" r="4"/><circle cx="53" cy="68" r="4"/><circle cx="102" cy="8" r="4"/><circle cx="102" cy="38" r="4"/><circle cx="102" cy="68" r="4"/></g>
    <g fill="#6F4C9B"><circle cx="151" cy="11" r="4"/><circle cx="151" cy="27" r="4"/><circle cx="151" cy="43" r="4"/><circle cx="151" cy="59" r="4"/><circle cx="151" cy="75" r="4"/><circle cx="151" cy="91" r="4"/></g>
  </g>
  <text x="420" y="181" text-anchor="middle" class="label">Q-network</text>
  <text x="420" y="207" text-anchor="middle" class="small">23 → 128 → 128 → 6</text>
  <text x="420" y="233" text-anchor="middle" class="small">a<tspan baseline-shift="sub" font-size="10">t</tspan> = arg max<tspan baseline-shift="sub" font-size="10">a</tspan> Q(s<tspan baseline-shift="sub" font-size="10">t</tspan>, a)</text>
  <text x="420" y="303" text-anchor="middle" class="title">DQN-Based ABR</text>

  <!-- Selected action to the runtime segment operation -->
  <line x1="540" y1="170" x2="599" y2="170" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="569.5" y="144" text-anchor="middle" class="primary-link">Tier</text>
  <text x="569.5" y="160" text-anchor="middle" class="link">a<tspan baseline-shift="sub" font-size="10">t</tspan></text>

  <!-- Runtime-only segment selection and state update -->
  <g transform="translate(10,0)">
  <rect x="593" y="20" width="232" height="300" rx="16" fill="#E1EFF8" stroke="#0072B2" stroke-width="1.8" filter="url(#shadow)"/>
  <rect x="609" y="48" width="200" height="38" rx="8" fill="#0072B2"/>
  <text x="709" y="72" text-anchor="middle" font-size="14.5" font-weight="600" fill="#FFFFFF">Select tier r01–r06</text>
  <line x1="709" y1="89" x2="709" y2="98" stroke="#334155" stroke-width="1.5" marker-end="url(#stepArrow)"/>
  <rect x="609" y="101" width="200" height="38" rx="8" fill="#F2FBF8" stroke="#009E73" stroke-width="1.3"/>
  <text x="709" y="125" text-anchor="middle" class="label">Request 8-frame segment</text>
  <line x1="709" y1="142" x2="709" y2="151" stroke="#334155" stroke-width="1.5" marker-end="url(#stepArrow)"/>
  <rect x="609" y="154" width="200" height="38" rx="8" fill="#E1F3ED" stroke="#009E73" stroke-width="1.3"/>
  <text x="709" y="178" text-anchor="middle" class="label">5G segment download</text>
  <line x1="709" y1="195" x2="709" y2="204" stroke="#334155" stroke-width="1.5" marker-end="url(#stepArrow)"/>
  <rect x="609" y="207" width="200" height="38" rx="8" fill="#FFF7E8" stroke="#E69F00" stroke-width="1.3"/>
  <text x="709" y="231" text-anchor="middle" class="label">Update client state</text>
  <text x="709" y="303" text-anchor="middle" class="title">Runtime Segment Selection</text>
  </g>

  <!-- Solid runtime feedback; reward and training are outside this figure -->
  <path d="M719,324 V360 H121 V324" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="420" y="349" text-anchor="middle" class="primary-link">Updated state s<tspan baseline-shift="sub" font-size="11">t+1</tspan></text>
</svg>
</div>
</body>
</html>
