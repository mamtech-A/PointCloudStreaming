<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Double-Column Point-Cloud Streaming System Model</title>
<style>
  html,body{margin:0;padding:0;background:#fff;}
  .wrap{width:840px;margin:0 auto;padding:18px;}
  svg{width:100%;height:auto;font-family:Arial,Helvetica,sans-serif;}
  .title{font-size:17px;font-weight:700;fill:#172231;}
  .label{font-size:14.5px;font-weight:600;fill:#243447;}
  .small{font-size:13.5px;fill:#526171;}
  .tiny{font-size:11.5px;fill:#526171;}
  .link{font-size:14px;font-weight:600;fill:#27384a;}
  .primary-link{font-size:15.5px;font-weight:600;fill:#27384a;}
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 840 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#24364b" flood-opacity="0.13"/>
    </filter>
  </defs>

  <!-- MPEG 8iVFBv2 dataset: four source sequences -->
  <rect x="5" y="18" width="180" height="504" rx="16" fill="#FDE8C8" stroke="#E69F00" stroke-width="1.7" filter="url(#shadow)"/>
  <text x="95" y="507" text-anchor="middle" class="title">MPEG 8iVFBv2</text>

  <g>
    <rect x="18" y="31" width="154" height="101" rx="10" fill="#FFF7E8" stroke="#F2C66D"/>
    <image href="pointcloud_sequences/longdress_transparent.png" x="22" y="37" width="54" height="88" preserveAspectRatio="xMidYMid meet"/>
    <text x="122" y="84" text-anchor="middle" class="label">Longdress</text>

    <rect x="18" y="145" width="154" height="101" rx="10" fill="#FFF7E8" stroke="#F2C66D"/>
    <image href="pointcloud_sequences/loot_transparent.png" x="22" y="151" width="54" height="88" preserveAspectRatio="xMidYMid meet"/>
    <text x="122" y="198" text-anchor="middle" class="label">Loot</text>

    <rect x="18" y="259" width="154" height="101" rx="10" fill="#FFF7E8" stroke="#F2C66D"/>
    <image href="pointcloud_sequences/redandblack_transparent.png" x="22" y="265" width="54" height="88" preserveAspectRatio="xMidYMid meet"/>
    <text x="122" y="312" text-anchor="middle" class="label">Redandblack</text>

    <rect x="18" y="373" width="154" height="101" rx="10" fill="#FFF7E8" stroke="#F2C66D"/>
    <image href="pointcloud_sequences/soldier_transparent.png" x="22" y="379" width="54" height="88" preserveAspectRatio="xMidYMid meet"/>
    <text x="122" y="426" text-anchor="middle" class="label">Soldier</text>
  </g>

  <!-- Dataset to G-PCC -->
  <line x1="189" y1="130" x2="226" y2="130" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="208" y="119" text-anchor="middle" class="primary-link">PLYs</text>

  <!-- MPEG G-PCC encoder (core-node size: 200 x 190) -->
  <rect x="230" y="18" width="200" height="190" rx="16" fill="#F4E5EF" stroke="#CC79A7" stroke-width="1.7" filter="url(#shadow)"/>
  <!-- Unconnected point samples encoded into a G-PCC bitstream file -->
  <g transform="translate(288,48)" stroke="#9E4E84" stroke-width="1.7" fill="none">
    <g stroke="none">
      <circle cx="13" cy="5" r="2.2" fill="#9E4E84"/>
      <circle cx="4" cy="13" r="2.6" fill="#E2ACCC"/>
      <circle cx="25" cy="11" r="1.9" fill="#CC79A7"/>
      <circle cx="17" cy="19" r="2.5" fill="#9E4E84"/>
      <circle cx="7" cy="26" r="1.8" fill="#B85F96"/>
      <circle cx="29" cy="27" r="2.4" fill="#E2ACCC"/>
      <circle cx="19" cy="34" r="2" fill="#CC79A7"/>
      <circle cx="3" cy="39" r="2.3" fill="#9E4E84"/>
      <circle cx="27" cy="43" r="1.8" fill="#9E4E84"/>
      <circle cx="11" cy="48" r="2.6" fill="#E2ACCC"/>
      <circle cx="21" cy="55" r="2.3" fill="#B85F96"/>
      <circle cx="6" cy="59" r="1.9" fill="#CC79A7"/>
      <circle cx="29" cy="64" r="2.5" fill="#9E4E84"/>
      <circle cx="14" cy="70" r="2.1" fill="#9E4E84"/>
    </g>
    <path d="M34,38 H47" marker-end="url(#arrow)"/>
    <path d="M54,17 H75 L84,26 V64 H54 Z" fill="#FAEFF6"/>
    <path d="M75,17 V26 H84"/>
    <path d="M60,37 H78 M60,45 H78 M60,53 H74"/>
  </g>
  <text x="330" y="153" text-anchor="middle" class="title">MPEG G-PCC</text>
  <text x="330" y="174" text-anchor="middle" class="small">TMC13 encoder</text>
  <text x="330" y="192" text-anchor="middle" class="small">Geometry + attribute coding</text>

  <!-- G-PCC output stored directly at the origin server -->
  <line x1="434" y1="130" x2="631" y2="130" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="533" y="67" text-anchor="middle" class="primary-link">Six-tier G-PCC segments</text>
  <text x="533" y="86" text-anchor="middle" class="small">High, Med-high, Medium</text>
  <text x="533" y="103" text-anchor="middle" class="small">Med-low, Low, Very low</text>
  <text x="533" y="120" text-anchor="middle" class="small">8 frames/segment + MPD</text>

  <!-- Content server (core-node size: 200 x 190) -->
  <rect x="635" y="18" width="200" height="190" rx="16" fill="#E1EFF8" stroke="#0072B2" stroke-width="1.8" filter="url(#shadow)"/>
  <g transform="translate(697,48)" stroke="#0072B2" stroke-width="2" fill="none">
    <rect x="0" y="0" width="76" height="20" rx="5"/><circle cx="12" cy="10" r="3" fill="#0072B2"/>
    <rect x="0" y="28" width="76" height="20" rx="5"/><circle cx="12" cy="38" r="3" fill="#0072B2"/>
    <rect x="0" y="56" width="76" height="20" rx="5"/><circle cx="12" cy="66" r="3" fill="#0072B2"/>
  </g>
  <text x="735" y="153" text-anchor="middle" class="title">Content Server</text>
  <text x="735" y="174" text-anchor="middle" class="small">Encoded segments + MPD</text>

  <!-- Server-edge unconstrained backhaul -->
  <path d="M709,212 V328" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M761,328 V212" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="675" y="246" width="120" height="50" rx="7" fill="#ffffff" fill-opacity="0.96"/>
  <text x="735" y="266" text-anchor="middle" class="primary-link">Unconstrained</text>
  <text x="735" y="285" text-anchor="middle" class="primary-link">backhaul</text>
  <text x="695" y="316" text-anchor="end" class="link">Segment</text>
  <text x="775" y="316" class="link">Request</text>

  <!-- Edge node (core-node size: 200 x 190) -->
  <rect x="635" y="332" width="200" height="190" rx="16" fill="#E1F3ED" stroke="#009E73" stroke-width="1.8" filter="url(#shadow)"/>
  <!-- Single centered edge-computing gateway icon -->
  <g transform="translate(697,376)" stroke="#007D5B" stroke-width="2" fill="none">
    <path d="M22,15 Q38,0 54,15"/>
    <path d="M28,21 Q38,11 48,21"/>
    <circle cx="38" cy="27" r="3.5" fill="#007D5B"/>
    <line x1="38" y1="31" x2="38" y2="38"/>
    <rect x="5" y="38" width="66" height="48" rx="9" fill="#F2FBF8"/>
    <rect x="27" y="49" width="22" height="22" rx="4" fill="#CDEDE3"/>
    <path d="M16,50 V74 H27 M60,50 V74 H49"/>
    <circle cx="16" cy="50" r="3" fill="#009E73"/><circle cx="16" cy="74" r="3" fill="#009E73"/>
    <circle cx="60" cy="50" r="3" fill="#009E73"/><circle cx="60" cy="74" r="3" fill="#009E73"/>
    <path d="M32,56 H44 M32,63 H44"/>
  </g>
  <text x="735" y="493" text-anchor="middle" class="title">Edge Node</text>

  <!-- Simplified client (core-node size: 200 x 190) -->
  <rect x="230" y="332" width="200" height="190" rx="16" fill="#F6F6F6" stroke="#6B7280" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="330" y="495" text-anchor="middle" class="title">Point-Cloud Client</text>

  <!-- High-level client ABR function -->
  <rect x="250" y="367" width="160" height="105" rx="12" fill="#EAE4F3" stroke="#6F4C9B" stroke-width="1.8"/>
  <!-- Symmetric 60-unit-wide DQN neural-network policy icon -->
  <g transform="translate(300,378)" stroke="#6F4C9B" stroke-width="1.25" fill="none">
    <line x1="2" y1="5" x2="30" y2="3"/><line x1="2" y1="5" x2="30" y2="11"/>
    <line x1="2" y1="15" x2="30" y2="3"/><line x1="2" y1="15" x2="30" y2="11"/><line x1="2" y1="15" x2="30" y2="19"/>
    <line x1="2" y1="25" x2="30" y2="19"/><line x1="2" y1="25" x2="30" y2="27"/>
    <line x1="30" y1="3" x2="58" y2="9"/><line x1="30" y1="11" x2="58" y2="9"/>
    <line x1="30" y1="11" x2="58" y2="21"/><line x1="30" y1="19" x2="58" y2="9"/>
    <line x1="30" y1="19" x2="58" y2="21"/><line x1="30" y1="27" x2="58" y2="21"/>
    <circle cx="2" cy="5" r="2.8" fill="#C7B7DA"/><circle cx="2" cy="15" r="2.8" fill="#C7B7DA"/><circle cx="2" cy="25" r="2.8" fill="#C7B7DA"/>
    <circle cx="30" cy="3" r="2.8" fill="#9278B2"/><circle cx="30" cy="11" r="2.8" fill="#9278B2"/><circle cx="30" cy="19" r="2.8" fill="#9278B2"/><circle cx="30" cy="27" r="2.8" fill="#9278B2"/>
    <circle cx="58" cy="9" r="2.8" fill="#6F4C9B"/><circle cx="58" cy="21" r="2.8" fill="#6F4C9B"/>
  </g>
  <text x="330" y="428" text-anchor="middle" class="title">DQN-based ABR</text>
  <text x="330" y="449" text-anchor="middle" class="small">Next-segment tier</text>
  <text x="330" y="465" text-anchor="middle" class="small">selection</text>

  <!-- Edge-client 5G exchange -->
  <line x1="631" y1="380" x2="434" y2="380" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="533" y="365" text-anchor="middle" class="link">Point-cloud segment</text>
  <line x1="434" y1="460" x2="631" y2="460" stroke="#334155" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="533" y="481" text-anchor="middle" class="link">Selected-tier request</text>
  <text x="533" y="426" text-anchor="middle" class="primary-link">5G access link</text>
</svg>
</div>
</body>
</html>
